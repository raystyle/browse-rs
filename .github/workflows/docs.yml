name: docs
on: [push, pull_request]
jobs:
  # wsl 开发端视图跑文档面（用户裁定 2026-09-16：Windows 编译面是 win-gnu 非 msvc，
  # aidoc 投影随开发端主机视图 --retarget 定标，宿主机 msvc 岗退役；win-gnu 面在 ci.yml）
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --doc --workspace
      - run: cargo doc --no-deps --workspace
      - run: cargo install cargo-aidoc --locked
      - run: rustup toolchain install nightly-2026-07-07 --profile minimal
      - run: cargo aidoc --check --strict
  # POSIX 管道通道（fd 3/4 布线）只在 unix 编译；CI ubuntu 当编译+单测门禁
  posix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p cdp --all-targets -- -D warnings
      - run: cargo test -p cdp

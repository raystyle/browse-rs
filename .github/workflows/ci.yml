name: ci

on:
  push:
    branches: [main]
  pull_request:

# Rust 三岗 CI（总台定调 2026-09-16）：linux 本职、win-gnu 交叉、mac 本职。
# 工具链由 rust-toolchain.toml 钉版驱动；e2e 需真 chrome，BROWSE_E2E 门控跳过。
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  win-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: rustup target add x86_64-pc-windows-gnu
      # --all-targets（#53 评审 G1）：裸 check 不编译集成测试，argv 契约
      # 锁在 windows 面曾是零编译闸
      - run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

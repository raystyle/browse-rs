# 发布流水（总台令 2026-09-17 建，下版起自播）：v* tag 触发，三平台构建照
# CLI 资产窗产线（wsl 实操同形：linux 本职加 win-gnu 交叉加 mac arm64），
# 包形照 v0.4.1（单顶层目录 = browse 二进制加 README 加 LICENSE 双件，
# linux/mac tar.gz 加 win zip，逐包 sha256sum 原生格式边车），gh release 挂件，
# rclone 推镜像 browse/<版本>/ 六对象（env 形配置同家规：NO_CHECK_BUCKET
# 必带加 immutable 缓存头；版本段无 v 前缀，与代发的 0.4.1 段一致）。
# 总台只剩 catalog pin 滚（治理面）。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install mingw-w64
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # tag 与 Cargo.toml workspace 版本一致性闸（flow-release 第四节：不一致 job 直接红）
      - name: Version consistency gate
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          want="${tag#v}"
          got=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          [ "$want" = "$got" ] || { echo "tag $tag 与 Cargo.toml $got 不一致"; exit 1; }
      - name: Test
        if: matrix.target != 'x86_64-pc-windows-gnu'
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p browse-cli
      - name: Package
        shell: bash
        run: |
          triple="${{ matrix.target }}"
          tag="${GITHUB_REF#refs/tags/}"
          src="target/${triple}/release/browse"
          case "${triple}" in *-pc-windows-*) src="${src}.exe";; esac
          d="browse-${tag}-${triple}"
          mkdir -p "dist/${d}"
          cp "$src" "dist/${d}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${d}/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -q -r "${d}.zip" "$d" && sha256sum "${d}.zip" > "${d}.zip.sha256")
          else
            (cd dist && tar czf "${d}.tar.gz" "$d" && sha256sum "${d}.tar.gz" > "${d}.tar.gz.sha256")
          fi
      - name: Smoke unpack (linux/mac 岗本机直跑；win 交叉岗 PE 不可跑，另岗验)
        if: matrix.target != 'x86_64-pc-windows-gnu'
        shell: bash
        run: |
          triple="${{ matrix.target }}"
          tag="${GITHUB_REF#refs/tags/}"
          d="browse-${tag}-${triple}"
          rm -rf /tmp/smoke && mkdir /tmp/smoke
          tar xzf "dist/${d}.tar.gz" -C /tmp/smoke
          got=$("/tmp/smoke/${d}/browse" --version)
          echo "smoke: ${got}"
          [ "$got" = "browse ${tag#v}" ]
      - uses: actions/upload-artifact@v4
        with:
          name: browse-${{ matrix.target }}
          path: dist/*

  # win 交叉件运行时冒烟（家规 hst 形跳过，本仓加岗补齐总台令的冒烟必过面）
  smoke-win:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browse-x86_64-pc-windows-gnu
          path: dist
      - name: Smoke unpack
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          d="browse-${tag}-x86_64-pc-windows-gnu"
          unzip -q "dist/${d}.zip" -d /tmp/smoke 2>/dev/null || unzip -q "dist/${d}.zip" -d "$TEMP/smoke"
          bin="/tmp/smoke/${d}/browse.exe"
          [ -f "$bin" ] || bin="$TEMP/smoke/${d}/browse.exe"
          got=$("$bin" --version)
          echo "smoke: ${got}"
          [ "$got" = "browse ${tag#v}" ]

  release:
    needs: [build, smoke-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" dist/*.zip dist/*.tar.gz dist/*.sha256 --latest \
            --title "browse $tag" \
            --notes "正式版 $tag（版本 tag 触发自播构建）。三平台包加 sha256 边车；镜像 browse/${tag#v}/ 同步。agent 发现通道：browse --llms。"

  # 镜像自推 R2（env 桶）：browse/<版本>/ 段六对象，immutable 段不 sync 只 copy
  #（版本段不可变，无清理面）；家规 env 形四键加 NO_CHECK_BUCKET。
  mirror:
    needs: release
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      # 必带（家规 D41 实证）：受限 token 无建桶权，预检 CreateBucket 会 403
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install rclone if missing
        run: command -v rclone || (curl -fsSL https://rclone.org/install.sh | sudo bash)
      - name: Mirror to R2
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          mkdir -p dist-browse
          mv dist/browse-* dist-browse/
          rclone copy dist-browse/ "r2:${R2_BUCKET}/browse/${ver}/" \
            --include "*.zip" --include "*.tar.gz" --include "*.sha256" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            --checksum -v --stats-one-line
          rclone lsl "r2:${R2_BUCKET}/browse/${ver}/"

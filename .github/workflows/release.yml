# 播种流水（批一重构，总台核准 2026-09-17，对齐 build-release 标准三段式）：
# CI 面不编译——本地编译打包与 gh release 直发在 tools/release.pwsh（批二），
# 本流水只管自动播种 R2：release published 事件触发，从 Release 拉资产
# rclone 推双段（browse/<版本>/ immutable copy-only 加 browse/stable/ 滚动段
# sync --delete-excluded），双段零上传红灯分别报数，dispatch 带 tag 补推口。
# 四键 Secrets env 形同家规（hst D41 实证：NO_CHECK_BUCKET 必带）。
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 补推的 release tag（如 v0.4.2；从该 Release 拉资产重灌双段）
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      # 必带（家规 D41 实证）：受限 token 无建桶权，预检 CreateBucket 会 403
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Resolve tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "tag 形不对：$tag（要 v*）"; exit 1 ;;
          esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VER=${tag#v}" >> "$GITHUB_ENV"
      - name: Install rclone if missing
        run: command -v rclone || (curl -fsSL https://rclone.org/install.sh | sudo bash)
      - name: Fetch release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          # 资产清点：三包加三边车；边车锚原生校验（sha256sum -c）
          n=$(ls ./*.zip ./*.tar.gz 2>/dev/null | wc -l)
          [ "$n" -eq 3 ] || { echo "包数 $n != 3"; ls -la; exit 1; }
          sha256sum -c ./*.sha256
      - name: Seed version segment (immutable, copy-only)
        run: |
          rclone copy dist/ "r2:${R2_BUCKET}/browse/${VER}/" \
            --include "*.zip" --include "*.tar.gz" --include "*.sha256" \
            --immutable \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            --checksum -v --stats-one-line
      - name: Seed stable segment (sync 滚代清旧)
        run: |
          rclone sync dist/ "r2:${R2_BUCKET}/browse/stable/" \
            --include "*.zip" --include "*.tar.gz" --include "*.sha256" \
            --delete-excluded \
            --header-upload "Cache-Control: public, max-age=60" \
            --checksum -v --stats-one-line
      - name: Zero-upload red light (双段分别报数，零即红)
        run: |
          v_n=$(rclone lsf "r2:${R2_BUCKET}/browse/${VER}/" | wc -l)
          s_n=$(rclone lsf "r2:${R2_BUCKET}/browse/stable/" | wc -l)
          echo "版本段 browse/${VER}/：${v_n} 对象；stable 段 browse/stable/：${s_n} 对象"
          [ "$v_n" -ge 6 ] || { echo "红灯：版本段对象数 ${v_n} < 6（半失败）"; exit 1; }
          [ "$s_n" -ge 6 ] || { echo "红灯：stable 段对象数 ${s_n} < 6（半失败）"; exit 1; }
